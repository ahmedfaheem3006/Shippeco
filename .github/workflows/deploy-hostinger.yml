name: Deploy React to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-production-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -d dist/assets

          echo "Build files:"
          find dist -maxdepth 2 -type f -print

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy to shippeco.com
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set cmd:fail-exit true
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30

          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"

          echo "FTP root:"
          cls -la /

          echo "Domains:"
          cls -la /domains

          echo "Shippeco domain folder:"
          cls -la /domains/shippeco.com

          echo "Uploading to the real domain document root..."

          mirror \
            --reverse \
            --delete \
            --verbose \
            --parallel=2 \
            ./dist/ \
            /domains/shippeco.com/public_html/

          echo "Final deployed files:"
          cls -la /domains/shippeco.com/public_html

          echo "Final assets:"
          cls -la /domains/shippeco.com/public_html/assets

          bye
          EOF